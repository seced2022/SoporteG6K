<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Heidegger Live</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/cards.css">
    <link rel="stylesheet" href="css/responsive.css">

</head>

<body>

    <!-- CABECERA -->

    <header id="headerPrincipal"> 

        <div class="top-bar">

    <div class="brand">

        <h1>HEIDEGGER</h1>

        <span>Live Rally Platform</span>

    </div>

    <div class="live-info">

        <div class="status online">

            <span class="dot"></span>

            ONLINE

        </div>

        <div id="clock">

            00:00:00

        </div>

    </div>

</div>

<div class="hero">

    <h2>Eventos</h2>

    <p>

        Rallyes · Rallysprint · Montaña · Slalom · Cronometradas

    </p>

</div>

    </header>

    <!-- CONTENIDO -->

    <main id="contenido">

        <!-- Banner -->

        <section id="bannerPrincipal">

        </section>

        <!-- Eventos en directo -->

        <section id="eventosDirecto">

            <h3 class="section-title">EN DIRECTO</h3>

<div class="event-card">

    <div class="event-header">

        <div>

            <h2>Rally Ciudad de Bailén</h2>

            <span class="championship">

                Campeonato de Andalucía

            </span>

        </div>

        <div class="live-badge">

            EN DIRECTO

        </div>

    </div>

    <div class="event-info">

        <div>

            🏁 TC3 de 8

        </div>

        <div>

            👥 84 inscritos

        </div>

        <div>

            📍 Bailén (Jaén)

        </div>

    </div>

    <div class="leader-box">

        <span>LÍDER</span>

        <h3>Carlos García</h3>

        <p>Škoda Fabia Rally2</p>

    </div>

    <button class="follow-button">

        SEGUIR EVENTO

    </button>

</div>

        </section>

        <!-- Próximos eventos -->

        <section id="proximosEventos">

        </section>

        <!-- Resultados -->

        <section id="resultados">

        </section>

    </main>

    <!-- PIE -->

    <footer id="footerPrincipal">

    </footer>

    <script src="js/config.js"></script>

</body>

</html>
