<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heidegger Live</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/cards.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<header id="headerPrincipal">
<div class="top-bar">
<div class="brand">
<h1>HEIDEGGER</h1>
<span>Live Rally Platform</span>
</div>
<div class="live-info">
<div class="status online"><span class="dot"></span><span>ONLINE</span></div>
<div id="clock">00:00:00</div>
</div>
</div>
<section class="hero">
<h2>Eventos</h2>
<p>Sigue todas las pruebas desde un único lugar</p>
</section>
</header>

<main>
<section id="eventosDirecto">
<div class="section-header">
<h2>🟢 Eventos en directo</h2>
<span id="liveCount">0 eventos</span>
</div>
<div id="eventosGrid"></div>
</section>

<section id="proximosEventos">
<div class="section-header">
<h2>📅 Próximos eventos</h2>
<span>Próximamente</span>
</div>
<div id="proximosGrid"></div>
</section>

<section id="resultados">
<div class="section-header">
<h2>🏆 Últimos resultados</h2>
<span>Histórico</span>
</div>
<div id="resultadosGrid"></div>
</section>
</main>

<footer id="footerPrincipal">
<p>Heidegger Live</p>
<p>Tecnología G6K® Innovación Electrónica</p>
<p>Versión 0.1.0</p>
</footer>

<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
